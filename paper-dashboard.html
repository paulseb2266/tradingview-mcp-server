<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Trading Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface:         #fcfcfb;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --gridline:        #e1e0d9;
    --border:          rgba(11,11,11,0.10);
    --good:            #0ca30c;
    --critical:        #d03b3b;
    --good-bg:         #e6f6e6;
    --critical-bg:     #fbeaea;
    --series:          #2a78d6;
    --shadow:          0 1px 2px rgba(11,11,11,0.05), 0 1px 1px rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:            #0d0d0d;
      --surface:         #1a1a19;
      --text-primary:    #ffffff;
      --text-secondary:  #c3c2b7;
      --text-muted:      #898781;
      --gridline:        #2c2c2a;
      --border:          rgba(255,255,255,0.10);
      --good:            #0ca30c;
      --critical:        #e66767;
      --good-bg:         #10240f;
      --critical-bg:     #2c1414;
      --series:          #3987e5;
      --shadow:          0 1px 3px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:            #0d0d0d;
    --surface:         #1a1a19;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --text-muted:      #898781;
    --gridline:        #2c2c2a;
    --border:          rgba(255,255,255,0.10);
    --good:            #0ca30c;
    --critical:        #e66767;
    --good-bg:         #10240f;
    --critical-bg:     #2c1414;
    --series:          #3987e5;
    --shadow:          0 1px 3px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.75rem; }
  h1 { font-size: 1.4rem; font-weight: 650; margin: 0; }
  .last-updated { font-size: 0.8rem; color: var(--text-muted); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 1.75rem; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; box-shadow: var(--shadow); }
  .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 0.35rem; }
  .stat-value { font-size: 1.55rem; font-weight: 650; }
  .stat-value.good { color: var(--good); }
  .stat-value.critical { color: var(--critical); }

  section { margin-bottom: 2.25rem; }
  h2 { font-size: 1rem; font-weight: 650; margin: 0 0 0.75rem; }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 1rem 1.1rem 0.75rem; position: relative; }
  .equity-svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: none; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .grid-label { fill: var(--text-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .area-fill { fill: var(--series); opacity: 0.10; }
  .line-path { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .end-ring { fill: var(--surface); }
  .end-dot { fill: var(--series); }
  .end-label { fill: var(--text-primary); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; pointer-events: none; transition: opacity 0.1s; }
  .chart-tooltip {
    position: absolute; transform: translate(-50%, -115%); pointer-events: none; transition: opacity 0.1s;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem;
    box-shadow: var(--shadow); white-space: nowrap;
  }
  .tt-value { font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tt-label { font-size: 0.72rem; color: var(--text-secondary); }
  .chart-empty { padding: 2.5rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  thead th {
    text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-muted); font-weight: 600; padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--gridline);
  }
  tbody td { padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--page); }
  td.num { text-align: right; }

  .pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.critical { background: var(--critical-bg); color: var(--critical); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .pnl-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; }
  .meter { position: relative; width: 92px; height: 6px; }
  .meter-track { position: absolute; inset: 0; background: var(--gridline); border-radius: 3px; }
  .meter-zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--text-muted); }
  .meter-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .meter-fill.good { background: var(--good); }
  .meter-fill.critical { background: var(--critical); }

  .empty { color: var(--text-muted); padding: 1.5rem; text-align: center; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Paper Trading Dashboard</h1>
    <span class="last-updated" id="lastUpdated">loading…</span>
  </header>

  <div class="stat-row" id="statRow"></div>

  <section>
    <h2>Equity Curve</h2>
    <div class="chart-card" id="equityChartWrap"></div>
  </section>

  <section>
    <h2>Open Positions</h2>
    <div class="table-wrap" id="openPositionsWrap"></div>
  </section>

  <section>
    <h2>Closed Trades</h2>
    <div class="table-wrap" id="closedTradesWrap"></div>
  </section>
</div>

<script>
  const fmtMoney = n => n === null || n === undefined ? '—' : (n < 0 ? '-$' + Math.abs(n).toFixed(2) : '$' + n.toFixed(2));
  const fmtMoneyCompact = n => {
    const sign = n < 0 ? '-' : '';
    const abs = Math.abs(n);
    return sign + '$' + (abs >= 1000 ? (abs/1000).toFixed(1) + 'K' : abs.toFixed(0));
  };
  const fmtPct = n => n === null || n === undefined ? '—' : (n >= 0 ? '+' : '') + (n * 100).toFixed(0) + '%';
  const pnlClass = n => n === null || n === undefined ? '' : (n >= 0 ? 'good' : 'critical');

  function statTile(label, value, cls) {
    return `<div class="stat-tile"><div class="stat-label">${label}</div><div class="stat-value ${cls||''}">${value}</div></div>`;
  }

  function computeTotalEquity(data) {
    return data.balance + data.openPositions.reduce((s, p) => s + (p.currentPrice !== null ? p.currentPrice * 100 : p.costBasis), 0);
  }

  function renderStats(data) {
    const totalEquity = computeTotalEquity(data);
    const totalPnl = totalEquity - data.startingBalance;
    document.getElementById('statRow').innerHTML = [
      statTile('Cash Balance', fmtMoney(data.balance)),
      statTile('Total Equity', fmtMoney(totalEquity), pnlClass(totalPnl)),
      statTile('Total P&L', fmtMoney(totalPnl), pnlClass(totalPnl)),
      statTile('Open Positions', data.openPositions.length),
      statTile('Win Rate', data.stats.winRate === null ? '—' : (data.stats.winRate*100).toFixed(0) + '%'),
      statTile('Realized P&L', fmtMoney(data.stats.totalRealizedPnl), pnlClass(data.stats.totalRealizedPnl)),
    ].join('');
  }

  // ── Equity curve: line + area, hairline gridlines, end marker + label,
  //    crosshair + tooltip on hover (per dataviz interaction spec). ──
  function renderEquityChart(data) {
    const wrap = document.getElementById('equityChartWrap');
    const chronological = [...data.closedTrades].sort((a, b) => a.exitDate.localeCompare(b.exitDate));
    const points = [{ date: 'Start', balance: data.startingBalance }];
    for (const t of chronological) points.push({ date: t.exitDate, balance: t.balanceAfter });
    points.push({ date: 'Now', balance: computeTotalEquity(data) });

    if (points.length < 2) { wrap.innerHTML = '<div class="chart-empty">Not enough history yet.</div>'; return; }

    const W = 800, H = 220, padL = 56, padR = 16, padT = 16, padB = 12;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const values = points.map(p => p.balance);
    let min = Math.min(...values), max = Math.max(...values);
    if (min === max) { min -= 10; max += 10; }
    const pad = (max - min) * 0.15;
    min -= pad; max += pad;

    const x = i => points.length === 1 ? padL : padL + (i / (points.length - 1)) * plotW;
    const y = v => padT + plotH - ((v - min) / (max - min)) * plotH;

    const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(p.balance).toFixed(1)).join(' ');
    const baseline = (padT + plotH).toFixed(1);
    const areaPath = `${linePath} L${x(points.length-1).toFixed(1)},${baseline} L${x(0).toFixed(1)},${baseline} Z`;

    const gridVals = [min + (max-min)*0.2, min + (max-min)*0.5, min + (max-min)*0.8];
    const endX = x(points.length - 1), endY = y(points[points.length-1].balance);
    const endAbove = endY > padT + 16; // keep label from clipping the top edge

    wrap.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" class="equity-svg" id="equitySvg" preserveAspectRatio="none">
        ${gridVals.map(v => `
          <line x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gridline" />
          <text x="${padL-8}" y="${y(v).toFixed(1)}" class="grid-label" text-anchor="end" dominant-baseline="middle">${fmtMoneyCompact(v)}</text>
        `).join('')}
        <path d="${areaPath}" class="area-fill"></path>
        <path d="${linePath}" class="line-path"></path>
        <line x1="0" x2="0" y1="${padT}" y2="${padT+plotH}" class="crosshair" id="crosshairLine" style="opacity:0"></line>
        <circle cx="${endX.toFixed(1)}" cy="${endY.toFixed(1)}" r="6" class="end-ring"></circle>
        <circle cx="${endX.toFixed(1)}" cy="${endY.toFixed(1)}" r="4" class="end-dot"></circle>
        <text x="${(endX-9).toFixed(1)}" y="${(endAbove ? endY-12 : endY+20).toFixed(1)}" class="end-label" text-anchor="end">${fmtMoney(points[points.length-1].balance)}</text>
      </svg>
      <div class="chart-tooltip" id="chartTooltip" style="opacity:0"></div>
    `;

    const svg = document.getElementById('equitySvg');
    const crosshair = document.getElementById('crosshairLine');
    const tooltip = document.getElementById('chartTooltip');

    function moveTo(clientX) {
      const rect = svg.getBoundingClientRect();
      const px = (clientX - rect.left) / rect.width * W;
      let nearest = 0, bestDist = Infinity;
      points.forEach((p, i) => { const d = Math.abs(x(i) - px); if (d < bestDist) { bestDist = d; nearest = i; } });
      const nx = x(nearest), ny = y(points[nearest].balance);
      crosshair.setAttribute('x1', nx.toFixed(1));
      crosshair.setAttribute('x2', nx.toFixed(1));
      crosshair.style.opacity = 1;
      tooltip.style.opacity = 1;
      const valueEl = document.createElement('div'); valueEl.className = 'tt-value'; valueEl.textContent = fmtMoney(points[nearest].balance);
      const labelEl = document.createElement('div'); labelEl.className = 'tt-label'; labelEl.textContent = points[nearest].date;
      tooltip.replaceChildren(valueEl, labelEl);
      const rectWrap = wrap.getBoundingClientRect();
      tooltip.style.left = ((nx / W) * rectWrap.width) + 'px';
      tooltip.style.top = ((ny / H) * rectWrap.height) + 'px';
    }
    svg.addEventListener('pointermove', e => moveTo(e.clientX));
    svg.addEventListener('pointerleave', () => { crosshair.style.opacity = 0; tooltip.style.opacity = 0; });
  }

  // Meter: position within the -50% stop / +100% target range, zero-line marked.
  function pnlMeter(pnlPct) {
    if (pnlPct === null || pnlPct === undefined) return '';
    const MIN = -0.5, MAX = 1.0;
    const clamped = Math.max(MIN, Math.min(MAX, pnlPct));
    const zeroAt = (0 - MIN) / (MAX - MIN) * 100;
    const valueAt = (clamped - MIN) / (MAX - MIN) * 100;
    const cls = pnlPct >= 0 ? 'good' : 'critical';
    const left = pnlPct >= 0 ? zeroAt : valueAt;
    const width = Math.abs(valueAt - zeroAt);
    return `<div class="meter" title="${fmtPct(pnlPct)} of -50% stop / +100% target range">
      <div class="meter-track"></div>
      <div class="meter-zero" style="left:${zeroAt}%"></div>
      <div class="meter-fill ${cls}" style="left:${left}%; width:${width}%"></div>
    </div>`;
  }

  function renderOpenPositions(positions) {
    const wrap = document.getElementById('openPositionsWrap');
    if (!positions.length) { wrap.innerHTML = '<div class="empty">No open positions.</div>'; return; }
    wrap.innerHTML = `<table>
      <thead><tr><th>Ticker</th><th>Contract</th><th>Entry</th><th class="num">Entry $</th><th class="num">Current $</th><th class="num">P&L</th><th class="num">DTE</th></tr></thead>
      <tbody>${positions.map(p => `
        <tr>
          <td>${p.ticker}</td>
          <td>${p.strike}${p.optionType[0]} ${p.expiryDate}</td>
          <td>${p.entryDate}</td>
          <td class="num">${fmtMoney(p.entryPrice)}</td>
          <td class="num">${p.currentPrice !== null ? fmtMoney(p.currentPrice) : '—'}</td>
          <td class="num"><div class="pnl-cell"><span class="pill ${pnlClass(p.pnlPct)}">${fmtPct(p.pnlPct)} · ${fmtMoney(p.pnlDollars)}</span>${pnlMeter(p.pnlPct)}</div></td>
          <td class="num">${p.dteRemaining !== null ? p.dteRemaining : '—'}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  function renderClosedTrades(trades) {
    const wrap = document.getElementById('closedTradesWrap');
    if (!trades.length) { wrap.innerHTML = '<div class="empty">No closed trades yet.</div>'; return; }
    wrap.innerHTML = `<table>
      <thead><tr><th>Ticker</th><th>Contract</th><th>Entry → Exit</th><th class="num">Entry $</th><th class="num">Exit $</th><th class="num">P&L</th><th>Reason</th></tr></thead>
      <tbody>${trades.map(t => `
        <tr>
          <td>${t.ticker}</td>
          <td>${t.strike}${t.optionType[0]} ${t.expiryDate}</td>
          <td>${t.entryDate} → ${t.exitDate}</td>
          <td class="num">${fmtMoney(t.entryPrice)}</td>
          <td class="num">${fmtMoney(t.exitPrice)}</td>
          <td class="num"><span class="pill ${pnlClass(t.profitLoss)}">${fmtPct(t.profitLossPct)} · ${fmtMoney(t.profitLoss)}</span></td>
          <td>${t.exitReason}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  async function load() {
    try {
      const res = await fetch('/api/data');
      const data = await res.json();
      renderStats(data);
      renderEquityChart(data);
      renderOpenPositions(data.openPositions);
      renderClosedTrades(data.closedTrades);
      document.getElementById('lastUpdated').textContent = 'Updated ' + new Date(data.lastUpdated).toLocaleString();
    } catch (e) {
      document.getElementById('lastUpdated').textContent = 'Failed to load data';
    }
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
